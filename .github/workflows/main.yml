on:
  release:
    types:
      - created
  push:
  pull_request:

jobs:
  main:
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          runtime: node@22
          cache: true
          save-cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
